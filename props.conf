# props.conf - sourcetype for flattened AWS CloudTrail logs (one JSON event per line)
#
# Install in $SPLUNK_HOME/etc/system/local/props.conf
# or in a custom app: $SPLUNK_HOME/etc/apps/<your_app>/local/props.conf
# Restart Splunk after changing it.

[aws:cloudtrail]
# One event per line
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)

# Take the event time from the "eventTime" field (CloudTrail uses UTC)
TIME_PREFIX = "eventTime":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
TZ = UTC

# Extract JSON fields at search time
KV_MODE = json

# Do not truncate large events
TRUNCATE = 0
